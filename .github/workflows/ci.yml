name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes -p ajv-cli -p ajv-formats ajv validate -s schemas/metadata.schema.json -d 'services/figma.com/metadata.json' --spec=draft2020 -c ajv-formats

  # Dependabot の PR だけ。上のジョブがすべて成功し、major を含まないときに限って自動マージする。
  automerge:
    needs: [validate]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: major を含まなければマージ
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          if echo "$DEPS" | jq -e 'any(.[]; .updateType == "version-update:semver-major")' >/dev/null; then
            echo "major を含むので手動で確認する"; exit 0
          fi
          gh pr merge --squash "$PR_URL"
